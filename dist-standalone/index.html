 und spielen Fußball.",medium:"Letztes Wochenende war wunderbar. Am Samstag sind mein Vater und ich in den Park gegangen. Der Himmel war blau und die Vögel sangen.",hard:"Ich lerne seit drei Jahren Englisch. Mir macht es Spaß, neue Wörter und Phrasen zu lernen."},"kk-KZ":{easy:"Мен жазды өте жақсы көремін. Ауа-райы жылы және күннің көрінісі. Біз паркте жүріп, футбол ойнаймыз.",medium:"Өткен жұма күні ғажайып болды. Сенбі күні әкем мен мен паркке бардық. Аспан көк болды, құстар ән шырқады.",hard:"Мен үш жыл бойы ағылшын тілін үйреніп келемін. Мен жаңа сөздер мен сөйлемдерді үйренуді ұнатамын."}},kp=()=>!!("speechSynthesis"in window||"AndroidTTS"in window&&window.AndroidTTS),Le=(e,t,n)=>e?n:t,Cp=()=>{const e=()=>{try{const R=localStorage.getItem("dictationAppState");if(R)return JSON.parse(R)}catch(R){console.error("Error loading saved state:",R)}return{}},[t,n]=k.useState(!1),r=R=>{try{localStorage.setItem("dictationAppState",JSON.stringify(R))}catch(ee){console.error("Error saving state:",ee)}},l=e(),[o,i]=k.useState(l.inputText||""),[u,s]=k.useState(l.originalText||""),[c,g]=k.useState(null),[h,m]=k.useState(l.selectedLang||"ru-RU"),[v,C]=k.useState(l.dictationSpeed||1),[D,A]=k.useState(l.pauseDuration||500),[d,a]=k.useState(l.repeatCount||3),[f,y]=k.useState(l.orderMode||"sequential"),[N,_]=k.useState(l.strictPunctuation||!1),[x,w]=k.useState(!1),[T,S]=k.useState(l.showOriginalTextInput!==void 0?l.showOriginalTextInput:!0),[M,B]=k.useState(l.isTrainingMode||!1),[$,ie]=k.useState(0),[H,X]=k.useState([]),{isPlaying:fe,isPaused:P,currentSentenceIndex:L,totalSentences:O,startDictation:V,pauseDictation:J,stopDictation:Ie,goToNextSentence:Pe,goToPreviousSentence:lt,checkResults:Me}=xp({text:u,lang:h,speed:v,pauseDuration:D,repeatCount:d,orderMode:f,voice:H[$]||null}),[ot,it]=k.useState(null),[_r,An]=k.useState(!1),[Xl,Yt]=k.useState(0),[Q,Un]=k.useState(()=>{try{return localStorage.getItem("dictationTheme")==="dark"}catch{return!1}}),[Yl,Et]=k.useState(!1),Be=k.useRef(0)
