<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Speakertex favicon: retro microphone (brand style of logo.png) on app accent blue -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- mic head: solid capsule (outline vanishes at 16px, so fill) -->
  <rect x="172" y="84" width="168" height="248" rx="84" fill="#ffffff"/>

  <!-- sound-lines cut into the head (echo the logo texture) -->
  <g stroke="#1d4ed8" stroke-width="17" stroke-linecap="round" opacity="0.92">
    <line x1="214" y1="152" x2="298" y2="152"/>
    <line x1="214" y1="192" x2="298" y2="192"/>
    <line x1="214" y1="232" x2="298" y2="232"/>
  </g>

  <!-- stem -->
  <rect x="239" y="332" width="34" height="72" rx="8" fill="#ffffff"/>

  <!-- Y-shaped cradle -->
  <path d="M168 316 v36 a88 88 0 0 0 176 0 v-36"
        fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>

  <!-- base -->
  <rect x="146" y="408" width="220" height="30" rx="15" fill="#ffffff"/>
</svg>
